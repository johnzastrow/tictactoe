[package]
name = "demo-tui"
description = "demo terminal client: ratatui front end over the demo WebSocket protocol"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
demo-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
futures-util.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
unicode-width = "0.2"
# local "today" for natural dates (protocol §6 is relative to the client's local date)
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints]
workspace = true
