[package]
name = "ttt"
description = "Tic-tac-toe playable from a rich TUI and a local web page at the same time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ttt-core.workspace = true
ttt-server.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
ratatui.workspace = true
crossterm.workspace = true
clap.workspace = true
anyhow.workspace = true

[features]
default = ["web"]
# Build without it (`--no-default-features`) for a terminal-only binary
# that links no web server and opens no port.
web = ["ttt-server/web", "dep:tracing", "dep:tracing-subscriber"]

[lints]
workspace = true
