[package]
name = "demo-web"
description = "demo web client: Leptos (CSR) front end compiled to WebAssembly, served by demo-server"
version = "0.5.0"
edition.workspace = true
rust-version = "1.88"

[dependencies]
demo-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement",
    "Node", "NodeList", "Event", "EventTarget", "KeyboardEvent", "KeyboardEventInit", "MouseEvent", "PointerEvent",
    "FocusEvent", "DomRect", "WebSocket", "MessageEvent", "CloseEvent", "Location", "Storage", "History",
    "ScrollIntoViewOptions", "ScrollLogicalPosition", "HtmlCollection", "UrlSearchParams", "Url",
] }

[lints]
workspace = true
