[package]
name = "pt-tui"
description = "pt terminal client: ratatui front end over the pt WebSocket protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
pt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
futures-util.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
base64 = "0.22"
unicode-width = "0.2"

[lints]
workspace = true
