[workspace]
resolver = "3"
members = [
    "crates/ttt-core", "crates/ttt-server", "crates/ttt",
    "crates/pt-core", "crates/pt-server", "crates/pt-tui", "crates/pt-web", "crates/pt",
    "crates/demo-core", "crates/demo-server", "crates/demo-tui", "crates/demo-web", "crates/demo",
]
# pt-web and demo-web target wasm32 only; build them with trunk (see crates/pt-web, crates/demo-web).
default-members = [
    "crates/ttt-core", "crates/ttt-server", "crates/ttt",
    "crates/pt-core", "crates/pt-server", "crates/pt-tui", "crates/pt",
    "crates/demo-core", "crates/demo-server", "crates/demo-tui", "crates/demo",
]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
ttt-core = { path = "crates/ttt-core" }
# Members opt into ttt-server's "web" feature themselves (ttt does by default).
ttt-server = { path = "crates/ttt-server", default-features = false }
pt-core = { path = "crates/pt-core" }
pt-server = { path = "crates/pt-server" }
pt-tui = { path = "crates/pt-tui" }
demo-core = { path = "crates/demo-core" }
demo-server = { path = "crates/demo-server" }
demo-tui = { path = "crates/demo-tui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tokio-tungstenite = "0.30"
fastrand = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
